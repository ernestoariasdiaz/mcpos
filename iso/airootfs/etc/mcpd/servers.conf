# mcpd gateway — one MCP server per line:  name = command [args...]
# Tools appear to the client as <name>__<tool>. Add your own servers here.
shell   = /usr/local/bin/mcp-shell
journal = /usr/local/bin/mcp-journal
desktop = /usr/local/bin/mcp-desktop
a11y    = /usr/local/bin/mcp-a11y
explore = /usr/local/bin/mcp-explore
